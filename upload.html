<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quick Upload — H.E.L.P. Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:'DM Sans',-apple-system,system-ui,sans-serif;background:#0a0f1e;color:#e2e8f0;line-height:1.5}

.shell{max-width:560px;margin:0 auto;padding:24px 18px 60px;min-height:100vh}
.header{text-align:center;margin-bottom:24px;padding-top:10px}
.header .logo{font-size:11px;letter-spacing:2px;color:#94a3b8;text-transform:uppercase;margin-bottom:6px}
.header h1{font-size:24px;font-weight:700;letter-spacing:1px}
.header h1 b{color:#16A34A}

.card{background:#111827;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:22px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,0.25)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:#94a3b8;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;background:#0d1525;border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#e2e8f0;font:inherit;font-size:14px}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1E5BC0;box-shadow:0 0 0 3px rgba(30,91,192,0.15)}
.field .hint{color:#64748b;font-size:11.5px;margin-top:4px}

.btn{width:100%;padding:14px;background:#16A34A;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font:inherit;font-size:15px;letter-spacing:0.5px}
.btn:hover{background:#138a3e}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn.alt{background:transparent;color:#94a3b8;border:1px solid rgba(255,255,255,0.15)}
.btn.alt:hover{background:rgba(255,255,255,0.04);color:white}

.tab-row{display:flex;background:#0d1525;border-radius:8px;padding:4px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.08)}
.tab-row button{flex:1;padding:10px;background:transparent;color:#94a3b8;border:none;border-radius:6px;cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.tab-row button.active{background:#1E5BC0;color:white}

.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;color:#e2e8f0}
.toggle input{width:38px;height:22px;appearance:none;background:#374151;border-radius:11px;position:relative;cursor:pointer;transition:background 0.2s;margin:0}
.toggle input:checked{background:#16A34A}
.toggle input::before{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:white;border-radius:50%;transition:transform 0.2s}
.toggle input:checked::before{transform:translateX(16px)}

.file-area{padding:18px;border:1.5px dashed rgba(255,255,255,0.15);border-radius:10px;text-align:center;background:#0d1525;cursor:pointer}
.file-area:hover{border-color:#16A34A;background:#0e1830}
.file-area input[type=file]{display:none}
.file-area .pick{font-weight:600;color:#16A34A;font-size:14px}
.file-area .sub{font-size:12px;color:#64748b;margin-top:4px}
.file-area.has-file{border-style:solid;border-color:#16A34A}
.file-area .picked{font-size:13px;color:#e2e8f0;margin-top:6px}

.alert{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block}
.alert.err{background:rgba(220,38,38,0.12);border:1px solid rgba(220,38,38,0.3);color:#fca5a5}
.alert.ok{background:rgba(22,163,74,0.12);border:1px solid rgba(22,163,74,0.3);color:#86efac}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.25);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.done{text-align:center;padding:20px 0}
.done .ico{font-size:48px;color:#22c55e;margin-bottom:12px}
.done h2{font-size:20px;margin-bottom:6px}
.done p{color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:16px}
.done a.review-link{display:block;padding:10px 14px;background:#0d1525;border:1px solid rgba(30,91,192,0.4);border-radius:8px;color:#bdd5ff;text-decoration:none;word-break:break-all;font-size:12.5px;font-family:Consolas,monospace;margin-bottom:12px}

.row{display:flex;gap:8px}
.row > *{flex:1}
</style>
</head>
<body>

<div class="shell">

<div class="header">
  <div class="logo">H.E.L.P. CENTER</div>
  <h1>QUICK <b>UPLOAD</b></h1>
</div>

<!-- ════════════════════════════════════════════
     LOGIN
════════════════════════════════════════════ -->
<div class="card" id="login-card">
  <div class="field">
    <label>Owner password</label>
    <input type="password" id="login-pw" autocomplete="current-password" autofocus>
  </div>
  <div class="alert err" id="login-err"></div>
  <button class="btn" id="login-btn" onclick="login()">Unlock</button>
</div>

<!-- ════════════════════════════════════════════
     UPLOAD FORM
════════════════════════════════════════════ -->
<div id="form-wrap" style="display:none">

  <div class="card">
    <div class="field">
      <label>Client</label>
      <select id="client-sel"></select>
      <div class="hint" id="client-hint"></div>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>Deliverable type</label>
      <div class="tab-row">
        <button id="tab-url" class="active" onclick="setMode('url')">🔗 Link / URL</button>
        <button id="tab-file" onclick="setMode('file')">📎 File upload</button>
      </div>
    </div>

    <!-- URL MODE -->
    <div class="field" id="url-field">
      <label>URL</label>
      <input type="url" id="url-input" placeholder="https://...">
      <div class="hint">Live site, hosted file, video link, anything URL-addressable.</div>
    </div>

    <!-- FILE MODE -->
    <div class="field" id="file-field" style="display:none">
      <label>File</label>
      <label class="file-area" id="file-area">
        <div class="pick">📎 Choose a file</div>
        <div class="sub">Up to 50 MB. PDFs, images, mockups, zip files.</div>
        <input type="file" id="file-input" onchange="onFilePicked()">
        <div class="picked" id="file-picked" style="display:none"></div>
      </label>
    </div>

    <div class="field">
      <label>Title</label>
      <input type="text" id="title-input" placeholder='e.g. "Final logo files" or "Restaurant mockup v2"'>
    </div>

    <div class="field">
      <label>Description (optional)</label>
      <textarea id="desc-input" placeholder="What this is, what to look at, any review notes…"></textarea>
    </div>

    <div class="field" style="margin-bottom:6px">
      <label class="toggle"><input type="checkbox" id="notify-input" checked>Email the client a notification</label>
      <div class="hint">Recommended — they get a one-click link to their portal.</div>
    </div>
  </div>

  <div class="alert err" id="form-err"></div>
  <div class="alert ok" id="form-ok"></div>

  <button class="btn" id="submit-btn" onclick="submitDeliverable()">Add to Client Portal</button>
  <button class="btn alt" style="margin-top:10px" onclick="resetForm()">Reset form</button>

</div>

<!-- ════════════════════════════════════════════
     DONE STATE
════════════════════════════════════════════ -->
<div class="card" id="done-card" style="display:none">
  <div class="done">
    <div class="ico">✓</div>
    <h2 id="done-title">Added.</h2>
    <p id="done-detail"></p>
    <a id="done-link" href="#" target="_blank" class="review-link"></a>
    <button class="btn" onclick="anotherOne()">Upload another</button>
  </div>
</div>

</div>

<script>
const API = location.origin + '/api';

let ownerPassword = '';
let clients = [];
let mode = 'url';

/* ────────────────────────────────────────
   LOGIN
──────────────────────────────────────── */
document.getElementById('login-pw').addEventListener('keydown', e => {
  if(e.key === 'Enter') login();
});

async function login(){
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('login-err');
  err.classList.remove('show');
  if(!pw){ err.textContent='Enter your password.'; err.classList.add('show'); return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking…';

  try {
    const r = await fetch(API + '/owner/clients', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    if(r.status === 401){ throw new Error('Wrong password.'); }
    if(!r.ok){ throw new Error('Server error (HTTP ' + r.status + ')'); }
    const j = await r.json();
    clients = j.clients || [];
    ownerPassword = pw;
    showForm();
  } catch(e){
    err.textContent = e.message;
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

function showForm(){
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('form-wrap').style.display = 'block';
  const sel = document.getElementById('client-sel');
  if(!clients.length){
    sel.innerHTML = '<option>No clients yet</option>';
    document.getElementById('client-hint').textContent = 'Add clients in the work portal first.';
    return;
  }
  sel.innerHTML = clients.map(c =>
    `<option value="${c.portalToken}" data-email="${(c.email||'').replace(/"/g,'&quot;')}">${esc(c.name||'(unnamed)')} — ${esc(c.businessName||c.service||'')}</option>`
  ).join('');
  updateClientHint();
  sel.addEventListener('change', updateClientHint);
}

function updateClientHint(){
  const sel = document.getElementById('client-sel');
  const opt = sel.options[sel.selectedIndex];
  const email = opt ? opt.dataset.email : '';
  document.getElementById('client-hint').textContent = email ? `Notification will go to: ${email}` : 'No email on file — notification will be skipped.';
}

/* ────────────────────────────────────────
   MODE TOGGLE (URL vs FILE)
──────────────────────────────────────── */
function setMode(m){
  mode = m;
  document.getElementById('tab-url').classList.toggle('active', m === 'url');
  document.getElementById('tab-file').classList.toggle('active', m === 'file');
  document.getElementById('url-field').style.display = m === 'url' ? 'block' : 'none';
  document.getElementById('file-field').style.display = m === 'file' ? 'block' : 'none';
}

function onFilePicked(){
  const f = document.getElementById('file-input').files[0];
  const area = document.getElementById('file-area');
  const picked = document.getElementById('file-picked');
  if(f){
    area.classList.add('has-file');
    picked.style.display = 'block';
    picked.textContent = `${f.name} (${Math.round(f.size/1024)} KB)`;
  } else {
    area.classList.remove('has-file');
    picked.style.display = 'none';
  }
}

/* ────────────────────────────────────────
   SUBMIT
──────────────────────────────────────── */
async function submitDeliverable(){
  const errEl = document.getElementById('form-err');
  const okEl = document.getElementById('form-ok');
  errEl.classList.remove('show'); okEl.classList.remove('show');

  const portalToken = document.getElementById('client-sel').value;
  const title = document.getElementById('title-input').value.trim();
  const desc = document.getElementById('desc-input').value.trim();
  const notify = document.getElementById('notify-input').checked;

  if(!portalToken){ showErr('Pick a client.'); return; }
  if(!title){ showErr('Title is required.'); return; }

  let url = '';
  if(mode === 'url'){
    url = document.getElementById('url-input').value.trim();
    if(!url){ showErr('Enter a URL or switch to File upload.'); return; }
  } else {
    const file = document.getElementById('file-input').files[0];
    if(!file){ showErr('Pick a file or switch to URL.'); return; }
    // Upload the file first
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Uploading file…';
    try {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('clientId', portalToken);
      const upRes = await fetch(API + '/upload', { method:'POST', body: fd });
      if(!upRes.ok) throw new Error('Upload failed (HTTP ' + upRes.status + ')');
      const upJson = await upRes.json();
      url = upJson.url;
    } catch(e){
      showErr('File upload failed: ' + e.message);
      btn.disabled = false; btn.textContent = 'Add to Client Portal';
      return;
    }
  }

  // Save the deliverable
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving to portal…';

  try {
    const r = await fetch(API + '/owner/deliverable', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        password: ownerPassword,
        portalToken,
        deliverable: { name: title, description: desc, url },
        notify
      })
    });
    if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.error || ('HTTP '+r.status)); }
    const j = await r.json();
    showDone(j, portalToken);
  } catch(e){
    showErr('Save failed: ' + e.message);
    btn.disabled = false; btn.textContent = 'Add to Client Portal';
  }
}

function showErr(msg){
  const errEl = document.getElementById('form-err');
  errEl.textContent = msg; errEl.classList.add('show');
}
function showDone(result, portalToken){
  document.getElementById('form-wrap').style.display = 'none';
  document.getElementById('done-card').style.display = 'block';
  const portalUrl = location.origin + '/portal.html?t=' + portalToken;
  document.getElementById('done-title').textContent = result.emailed ? 'Added — client emailed.' : 'Added.';
  document.getElementById('done-detail').textContent = result.emailed
    ? 'A notification email was sent. The client can also open the portal at:'
    : 'No email sent (either the client has no email on file or you unchecked the box). The portal link is:';
  const linkEl = document.getElementById('done-link');
  linkEl.href = portalUrl; linkEl.textContent = portalUrl;
}

function anotherOne(){
  document.getElementById('done-card').style.display = 'none';
  document.getElementById('form-wrap').style.display = 'block';
  resetForm();
}
function resetForm(){
  document.getElementById('url-input').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('title-input').value = '';
  document.getElementById('desc-input').value = '';
  document.getElementById('file-picked').style.display = 'none';
  document.getElementById('file-area').classList.remove('has-file');
  document.getElementById('form-err').classList.remove('show');
  document.getElementById('form-ok').classList.remove('show');
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = 'Add to Client Portal';
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
