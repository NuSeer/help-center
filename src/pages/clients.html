      <div id="clients-page" class="page hidden">
        <div class="page-header">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div>
              <h1 class="page-title">Client Manager</h1>
              <p class="page-subtitle">Manage your client relationships and projects</p>
            </div>
            <button class="btn btn-solid" onclick="openAddClientModal()">+ Add Client</button>
          </div>
        </div>
        <div class="content">
          <div class="card" style="padding:16px;margin-bottom:20px;">
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
              <input type="text" id="client-search" placeholder="Search by name, business, email…" class="form-input" style="flex:1;min-width:200px;margin:0;" oninput="renderClients()">
              <select id="client-filter" class="form-select" style="width:150px;margin:0;" onchange="renderClients()">
                <option value="All">All Status</option>
                <option value="Lead">Lead</option>
                <option value="Active">Active</option>
                <option value="Completed">Completed</option>
                <option value="On Hold">On Hold</option>
              </select>
              <select id="client-sort" class="form-select" style="width:150px;margin:0;" onchange="renderClients()">
                <option value="name">Sort: Name</option>
                <option value="date">Sort: Date</option>
                <option value="status">Sort: Status</option>
                <option value="revenue">Sort: Revenue</option>
              </select>
              <div style="display:flex;border:1px solid var(--gray-300);border-radius:7px;overflow:hidden;height:38px">
                <button type="button" id="client-view-cards" onclick="setClientView('cards')" title="Card view"
                  style="border:none;background:var(--brand-primary);color:#fff;padding:0 14px;font-size:12px;font-weight:700;cursor:pointer">▦ Cards</button>
                <button type="button" id="client-view-list" onclick="setClientView('list')" title="List view"
                  style="border:none;border-left:1px solid var(--gray-300);background:#fff;color:var(--gray-600);padding:0 14px;font-size:12px;font-weight:700;cursor:pointer">≡ List</button>
              </div>
              <button type="button" onclick="printClientReport()" title="Print client list"
                style="border:1px solid var(--gray-300);background:#fff;color:var(--gray-700);padding:0 14px;height:38px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer"><span class="icon icon-sm" data-icon="print" style="margin-right:6px;vertical-align:-2px"></span>Print</button>
            </div>
          </div>
          <div id="clients-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;"></div>
        </div>
      </div>
