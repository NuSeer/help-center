<div id="pricing-page" class="page hidden">
  <div class="page-header">
    <h1 class="page-title">Services & Pricing</h1>
    <p class="page-subtitle">Your rate card, retainers, proposal builder, and client policies</p>
  </div>
  <div class="content">
    <div class="path-tabs-container">
      <div class="path-tabs-nav">
        <button class="path-tab active" onclick="pTab('pricing','grid',this)">Pricing</button>
        <button class="path-tab" onclick="pTab('pricing','retainers',this)">Retainers</button>
        <button class="path-tab" onclick="pTab('pricing','proposal',this)">Proposal Builder</button>
        <button class="path-tab" onclick="pTab('pricing','policies',this)">Client Policies</button>
      </div>

      <!-- TAB: PRICING GRID -->
      <div id="pricing-tab-grid" class="path-tab-content active">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px" id="pricing-cards"></div>
      </div>

      <!-- TAB: RETAINERS -->
      <div id="pricing-tab-retainers" class="path-tab-content">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:24px" id="retainer-cards"></div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h4 style="font-weight:700">Retainer Outreach Email Template</h4>
            <button onclick="copyText(this,document.getElementById('retainer-email-text').value)" class="btn btn-outline" style="padding:6px 14px;font-size:12px;color:var(--gold);border-color:var(--gold-border)">Copy Email</button>
          </div>
          <textarea id="retainer-email-text" class="form-input" style="height:220px;font-size:13px;font-family:monospace" readonly>Subject: Protect Your Website — Monthly Care Plans Now Available

Hi [Name],

I hope things are going well! I wanted to reach out because I'm now offering monthly website maintenance plans to my existing clients.

As your site grows, keeping it updated, backed up, and running smoothly takes ongoing attention — and I want to make sure you're covered.

MONTHLY PLANS:
• Site Care Plan — $150/mo (2 updates, bug fixes, monthly backup)
• Growth Plan — $250/mo (5 updates, new pages, priority support)
• Full Partner Plan — $400/mo (unlimited updates, strategy call, social graphics)

If you're interested, just reply to this email and I'll send over the details. No long-term contract — cancel anytime.

Talk soon,
Joy Watford
H.E.L.P. Center | joy@thehelpctr.com</textarea>
        </div>
      </div>

      <!-- TAB: PROPOSAL BUILDER -->
      <div id="pricing-tab-proposal" class="path-tab-content">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
          <div class="card">
            <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Proposal Details</h3>
            <div class="form-group"><label class="form-label">Client / Organization Name</label><input id="pb-client" class="form-input" style="margin:0" placeholder="e.g. Greater Hope Church"></div>
            <div class="form-group"><label class="form-label">Contact Person</label><input id="pb-contact" class="form-input" style="margin:0" placeholder="e.g. Pastor James Williams"></div>
            <div class="form-group"><label class="form-label">Service Package</label>
              <select id="pb-service" class="form-select" style="margin:0" onchange="updateProposalPreview()">
                <option value="">Select service...</option>
                <option>Landing Page — $600</option><option>Landing Page — $800</option><option>Landing Page — $1,000</option>
                <option>Business Website — $1,200</option><option>Business Website — $1,500</option><option>Business Website — $2,000</option><option>Business Website — $2,500</option>
                <option>E-Commerce Store — $1,500</option><option>E-Commerce Store — $2,000</option><option>E-Commerce Store — $2,500</option>
                <option>Custom Dashboard — $2,500</option><option>Custom Dashboard — $4,000</option><option>Custom Dashboard — $6,000</option>
                <option>Marketplace Platform — $4,000</option><option>Marketplace Platform — $6,000</option>
                <option>AI-Powered App — $1,500</option><option>AI-Powered App — $3,000</option>
                <option>Maintenance Retainer — $150/mo</option><option>Growth Retainer — $250/mo</option><option>Full Partner Retainer — $400/mo</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Project Description</label><textarea id="pb-desc" class="form-input" style="height:80px;resize:vertical;margin:0" placeholder="Brief description of what the client needs..." oninput="updateProposalPreview()"></textarea></div>
            <div class="form-group"><label class="form-label">Estimated Timeline</label>
              <select id="pb-timeline" class="form-select" style="margin:0" onchange="updateProposalPreview()">
                <option>1–2 business days</option><option>3–5 business days</option><option>5–7 business days</option>
                <option>1–2 weeks</option><option>2–3 weeks</option><option>3–4 weeks</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Additional Notes (optional)</label><textarea id="pb-notes" class="form-input" style="height:60px;resize:vertical;margin:0" placeholder="Hosting, domain transfer, special requirements..." oninput="updateProposalPreview()"></textarea></div>
            <button onclick="updateProposalPreview()" class="btn btn-solid" style="width:100%;margin-top:4px">Generate Proposal</button>
          </div>
          <div class="card" style="display:flex;flex-direction:column">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
              <h3 style="font-size:16px;font-weight:700">Live Preview</h3>
              <button onclick="copyProposal()" class="btn btn-outline" style="padding:6px 14px;font-size:12px;color:var(--gold);border-color:var(--gold-border)">Copy Proposal</button>
            </div>
            <textarea id="pb-preview" class="form-input" style="flex:1;min-height:420px;font-size:12px;font-family:monospace;resize:none" readonly placeholder="Fill in the form to generate your proposal..."></textarea>
          </div>
        </div>
      </div>

      <!-- TAB: CLIENT POLICIES -->
      <div id="pricing-tab-policies" class="path-tab-content">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px" id="policies-cards"></div>
      </div>
    </div>
  </div>
</div>
