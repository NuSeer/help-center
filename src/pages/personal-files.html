      <div id="personal-files-page" class="page hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
          <div>
            <h1 style="font-size:24px;font-weight:700;margin:0">Personal Files</h1>
            <p style="font-size:13px;color:var(--gray-500);margin:4px 0 0">Your private document storage. Not visible to clients or tenants.</p>
          </div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div style="font-size:14px;font-weight:600;margin-bottom:10px">Upload a file</div>
          <div id="pf-drop-zone"
               ondragover="event.preventDefault();this.style.background='#EFF6FF';this.style.borderColor='var(--brand-primary)';"
               ondragleave="this.style.background='#F8FAFC';this.style.borderColor='#CBD5E1';"
               ondrop="event.preventDefault();this.style.background='#F8FAFC';this.style.borderColor='#CBD5E1';if(event.dataTransfer.files&&event.dataTransfer.files[0]){_pfHandleFile(event.dataTransfer.files[0]);}"
               onclick="document.getElementById('pf-file-input').click()"
               style="border:2px dashed #CBD5E1;border-radius:10px;padding:32px;text-align:center;cursor:pointer;background:#F8FAFC;transition:all 0.15s;font-size:14px;color:#64748B">
            <div style="font-size:32px;margin-bottom:8px">📎</div>
            <strong style="color:#0F172A">Drag a file here</strong> or click to browse
            <div style="font-size:12px;color:#94A3B8;margin-top:4px">PDF, Word, images, ZIP, audio, video — up to 50MB</div>
          </div>
          <input type="file" id="pf-file-input" style="display:none" onchange="if(this.files[0])_pfHandleFile(this.files[0])">
          <div id="pf-status" style="font-size:12px;margin-top:8px;color:var(--gray-500)"></div>
        </div>
