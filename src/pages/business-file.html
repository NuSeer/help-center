      <div id="business-file-page" class="page hidden">
        <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <h1 class="page-title">Business File</h1>
            <p class="page-subtitle">Saved proposals, contracts, invoices, and brand packages — kept for auditing & client records</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="text" id="bf-search" placeholder="Search documents..." oninput="renderBusinessFile()"
              style="padding:9px 14px;border:0.5px solid rgba(0,0,0,0.15);border-radius:9px;font-size:13px;background:#f9f9f9;outline:none;color:#1a1a1a;font-family:inherit;min-width:220px">
            <button onclick="exportBusinessFile()" class="btn btn-outline" style="padding:9px 14px;font-size:13px"><span class="icon icon-sm" data-icon="download" style="margin-right:6px;vertical-align:-2px"></span>Export All (JSON)</button>
          </div>
        </div>
        <div class="content">
          <div class="card" style="margin-bottom:16px">
            <div style="font-size:14px;font-weight:600;margin-bottom:10px">Upload a file</div>
            <div id="bf-drop-zone"
                 ondragover="event.preventDefault();this.style.background='#EFF6FF';this.style.borderColor='var(--brand-primary)';"
                 ondragleave="this.style.background='#F8FAFC';this.style.borderColor='#CBD5E1';"
                 ondrop="event.preventDefault();this.style.background='#F8FAFC';this.style.borderColor='#CBD5E1';if(event.dataTransfer.files&&event.dataTransfer.files[0]){_bfHandleFile(event.dataTransfer.files[0]);}"
                 onclick="document.getElementById('bf-file-input').click()"
                 style="border:2px dashed #CBD5E1;border-radius:10px;padding:32px;text-align:center;cursor:pointer;background:#F8FAFC;transition:all 0.15s;font-size:14px;color:#64748B">
              <div style="font-size:32px;margin-bottom:8px">📎</div>
              <strong style="color:#0F172A">Drag a file here</strong> or click to browse
              <div style="font-size:12px;color:#94A3B8;margin-top:4px">PDF, Word, images, ZIP, audio, video — up to 50MB</div>
            </div>
            <input type="file" id="bf-file-input" style="display:none" onchange="if(this.files[0])_bfHandleFile(this.files[0])">
            <div id="bf-status" style="font-size:12px;margin-top:8px;color:var(--gray-500)"></div>
          </div>
          <div id="bf-folder-bar" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px"></div>
          <div id="bf-filter-bar" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"></div>
          <div id="bf-list"></div>
        </div>
      </div>
