      <div id="notes-page" class="page hidden">
        <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <h1 class="page-title">Notes</h1>
            <p class="page-subtitle">Save thoughts, ideas, AI outputs, and reference material</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="text" id="notes-search" placeholder="Search notes..." oninput="renderNotes()"
              style="padding:9px 14px;border:0.5px solid rgba(0,0,0,0.15);border-radius:9px;font-size:13px;background:#f9f9f9;outline:none;color:#1a1a1a;font-family:inherit;min-width:220px">
            <button class="btn btn-solid" onclick="openAddNoteModal()">+ New Note</button>
          </div>
        </div>
        <div class="content">
          <div id="notes-tags-bar" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"></div>
          <div id="notes-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:14px"></div>
        </div>
      </div>
